<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Bazme Adab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="stylesheet" href="../css/main.css">
<script src="../js/cursor.js" defer></script>
</head>
<body>

<div id="pageLoader">
  <div class="loader-mark"><span class="loader-dot"></span> Bazme Adab</div>
</div>

<div class="auth-wrap">
  <div class="auth-wrap-inner">
    <a href="../index.html" class="back-link">&larr; Back to home</a>
    <div class="auth-card">
      <a href="../index.html" class="auth-mark"><img src="../favicon.svg" alt=""> Bazme Adab</a>

      <div id="step1">
        <h2>Reset your password</h2>
        <p class="auth-sub">Enter the email you registered with — we'll send a reset link</p>
        <div class="auth-alert" id="alert"></div>
        <form id="requestForm">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@example.com">
            <div class="field-error" id="err"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
        </form>
      </div>

      <div id="step2" style="display:none;">
        <h2>Check your email</h2>
        <p class="auth-sub">We've sent a password reset link to your email. Click it to choose a new password.</p>
      </div>

      <div class="auth-links" style="justify-content:center;">
        <a href="student-login.html">Back to sign in</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/auth-supabase.js"></script>
<script>
const loadStart = Date.now();
window.addEventListener('load', function(){
  const elapsed = Date.now() - loadStart;
  const wait = Math.max(0, 450 - elapsed);
  setTimeout(function(){
    document.getElementById('pageLoader').classList.add('hide');
  }, wait);
});

document.getElementById('requestForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const errEl = document.getElementById('err');
  errEl.style.display = 'none';

  const result = await requestStudentPasswordReset(email);
  if (result.ok) {
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
  } else {
    errEl.textContent = result.error;
    errEl.style.display = 'block';
  }
});
</script>
</body>
</html>
